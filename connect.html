<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Telegram — UBOT</title><link rel="stylesheet" href="/style.css"></head><body class="auth-page"><main class="auth-card"><div class="eyebrow">UBOT / TELEGRAM</div><h1>Connect Account</h1><p class="muted">Masukkan nomor Telegram. OTP diproses melalui bridge userbot yang kamu kontrol.</p><div id="stepPhone"><label>Nomor Telegram</label><input id="phone" placeholder="+62xxxxxxxxxx" autocomplete="tel"><button id="request">Kirim OTP</button></div><div id="stepOtp" hidden><label>Kode OTP</label><input id="otp" inputmode="numeric" autocomplete="one-time-code"><button id="verify">Verifikasi OTP</button></div><div id="step2fa" hidden><label>Password 2FA</label><input id="password2fa" type="password" autocomplete="current-password"><button id="verify2fa">Verifikasi 2FA</button></div><div id="done" hidden class="notice">✓ Telegram berhasil terhubung.</div><pre id="log" class="log"></pre><a href="/">← Kembali ke dashboard</a></main><script>const $=x=>document.getElementById(x);async function call(action,body){const r=await fetch('/api/telegram-auth?action='+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||'Request gagal');return d}function log(x){$('log').textContent=x}$(request).onclick=async()=>{try{const d=await call('request-code',{phone:$('phone').value.trim()});$('stepOtp').hidden=false;$('stepPhone').hidden=true;log('OTP dikirim.');if(d.sessionId)sessionStorage.tgAuthSession=d.sessionId}catch(e){log('❌ '+e.message)}};$(verify).onclick=async()=>{try{const d=await call('verify-code',{sessionId:sessionStorage.tgAuthSession,code:$('otp').value.trim()});if(d.needs2fa){$('stepOtp').hidden=true;$('step2fa').hidden=false;log('Akun menggunakan 2FA. Masukkan password 2FA.')}else{done()}}catch(e){log('❌ '+e.message)}};$(verify2fa).onclick=async()=>{try{await call('verify-2fa',{sessionId:sessionStorage.tgAuthSession,password:$('password2fa').value});done()}catch(e){log('❌ '+e.message)}};function done(){$('step2fa').hidden=true;$('done').hidden=false;log('✓ Done. Session tetap disimpan di server bridge, bukan browser.');setTimeout(()=>location.href='/',700)}</script></body></html>
